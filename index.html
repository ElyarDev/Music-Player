<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC PLAYER</title>

    <!-- css  -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body class="dark-mode">
    <div class="music-player">
        <div class="cover-container">
            <img src="./assets/img/cover.png" alt="کاور موزیک" class="cover-image">
        </div>

        <div class="song-info">
            <h1 class="song-title">نام آهنگ</h1>
            <p class="artist-name">نام خواننده</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="time-info">
                <span class="current-time">0:00</span>
                <span class="duration">3:45</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="prev-btn" onclick="prevSong()">
                <i class="ri-skip-back-line"></i>
            </button>
            <button class="control-btn play-btn" id="play-btn">
                <i class="ri-play-line"></i>
            </button>
            <button class="control-btn" id="next-btn" onclick="nextSong()">
                <i class="ri-skip-forward-line"></i>
            </button>
        </div>

        <div class="extra-controls">
            <div class="volume-control">
                <i class="ri-volume-up-line"></i>
                <input type="range" min="0" max="100" value="80" class="volume-slider">
            </div>

            <div class="speed-control">
                <i class="ri-speed-line"></i>
                <select class="speed-selector">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
            </div>
        </div>
    </div>
    <script src="./assets/js/script.js"></script>
</body>

</html>
